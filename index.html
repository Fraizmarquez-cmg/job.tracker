<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker de Empleo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Tracker de Empleo</h1>
            <p>Gestiona tus postulaciones de empleo de manera eficiente y organizada para maximizar tus oportunidades
                laborales.</p>
        </header>

        <!-- Panel de Estadísticas / Contadores -->
        <div class="stats-container">
            <div class="stat-box">
                <span id="totalCount" class="stat-number">0</span>
                <span class="stat-label">Total</span>
            </div>
            <div class="stat-box">
                <span id="enviadoCount" class="stat-number">0</span>
                <span class="stat-label">Enviados</span>
            </div>
            <div class="stat-box">
                <span id="entrevistaCount" class="stat-number">0</span>
                <span class="stat-label">Entrevistas</span>
            </div>
            <div class="stat-box">
                <span id="ofertaCount" class="stat-number">0</span>
                <span class="stat-label">Ofertas</span>
            </div>
        </div>

        <!-- Formulario de Registro -->
        <div class="form-card">
            <input type="text" id="empresaInput" placeholder="Nombre de la empresa">
            <input type="text" id="puestoInput" placeholder="Nombre del puesto">
            <input type="date" id="fechaInput">
            <select id="estadoInput">
                <option value="Enviado">Enviado</option>
                <option value="Entrevista">Entrevista</option>
                <option value="Oferta">Oferta</option>
            </select>
            <button id="btnAgregar">Agregar Postulación</button>
        </div>

        <!-- Botones de Filtro -->
        <div class="filters-container">
            <button class="filter-btn active" data-filter="Todos">Todos</button>
            <button class="filter-btn" data-filter="Enviado">Enviados</button>
            <button class="filter-btn" data-filter="Entrevista">Entrevistas</button>
            <button class="filter-btn" data-filter="Oferta">Ofertas</button>
        </div>

        <!-- Contenedor de Tarjetas -->
        <main class="grid-jobs" id="jobsContainer">
            
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
